# pair-watcher model + price table (V47, V62). USD per million tokens, standard tier.
# Embedded in the binary; `~/.pair-watcher/models.toml` merges over it; `pair-watcher models update`
# fetches this file from the project.
version = 1

# Mid-tier per vendor, picked by `model = auto` (V46).
[defaults]
anthropic = "claude-sonnet-5-5"
openai = "gpt-6.1-sol"

[models."claude-haiku-4-5"]
vendor = "anthropic"
input = 1.00
cached = 0.10
cache_write = 1.25
output = 5.00

[models."claude-sonnet-5-5"]
vendor = "anthropic"
input = 2.00
cached = 0.20
cache_write = 2.50
output = 10.00

[models."claude-opus-5-5"]
vendor = "anthropic"
input = 4.00
cached = 0.20
cache_write = 5.00
output = 20.00

[models."claude-fable-5-1"]
vendor = "anthropic"
input = 10.00
cached = 0.25
cache_write = 12.50
output = 50.00

[models."gpt-6-luna"]
vendor = "openai"
input = 0.10
cached = 0.01
output = 0.50

[models."gpt-6.1-sol"]
vendor = "openai"
input = 2.00
cached = 0.10
output = 10.00

[models."gpt-6-astra"]
vendor = "openai"
input = 10.00
cached = 1.00
output = 50.00
